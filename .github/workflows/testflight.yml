name: "TestFlight ✈️"

# Runs entirely on the self-hosted runner on Sam's Mac (labels: self-hosted, macOS, swiftfin-mac):
# no GitHub-hosted macOS minutes are used.
#
# Signing is Xcode's automatic signing, authenticated with an App Store Connect API key
# (-allowProvisioningUpdates). Xcode creates/fetches the cloud-managed distribution certificate and
# App Store profiles itself, so no .p12 or .mobileprovision secrets are needed.
#
# Triggers:
#   - manually (Actions ▸ TestFlight ✈️ ▸ Run workflow)
#   - on every push to main, ONLY when the repository variable TESTFLIGHT_ON_PUSH is "true".
#     Bursts of pushes collapse into a single build of the newest commit.
#
# Secrets (Settings ▸ Secrets and variables ▸ Actions ▸ Secrets):
#   APP_STORE_KEY_ID        API key id
#   APP_STORE_ISSUER_ID     issuer id
#   APP_STORE_KEY_CONTENTS  the AuthKey_XXXX.p8 file, as-is or base64 (key role: Admin, needed for cloud signing)
#
# Repository variables:
#   TESTFLIGHT_ON_PUSH  "true" to upload a TestFlight build for every push to main

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform"
        required: true
        type: choice
        options:
          - All
          - iOS
          - tvOS
      version:
        description: "Version (empty = the project's MARKETING_VERSION)"
        required: false
        type: string
      build:
        description: "Build (empty = this run's number)"
        required: false
        type: number

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  testflight:
    name: "TestFlight ✈️ (${{ matrix.scheme }})"
    if: ${{ github.event_name != 'push' || vars.TESTFLIGHT_ON_PUSH == 'true' }}
    runs-on: [ self-hosted, macOS, swiftfin-mac ]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: iOS
            scheme: "Swiftfin"
            destination: "generic/platform=iOS"
          - platform: tvOS
            scheme: "Swiftfin tvOS"
            destination: "generic/platform=tvOS"

    env:
      SELECTED_PLATFORM: ${{ inputs.platform || 'All' }}
      SCHEME: ${{ matrix.scheme }}
      DESTINATION: ${{ matrix.destination }}
      KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
      KEY_CONTENTS: ${{ secrets.APP_STORE_KEY_CONTENTS }}
      INPUT_VERSION: ${{ inputs.version }}
      BUILD_NUMBER: ${{ inputs.build || github.run_number }}

    steps:
      - name: Skip unselected platform
        id: gate
        run: |
          if [ "$SELECTED_PLATFORM" = "All" ] || [ "$SELECTED_PLATFORM" = "${{ matrix.platform }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping ${{ matrix.platform }} (selected: $SELECTED_PLATFORM)"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Archive and upload
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"

          for v in KEY_ID ISSUER_ID KEY_CONTENTS; do
            if [ -z "$(printf '%s' "${!v}" | tr -d '[:space:]')" ]; then
              echo "Missing secret for $v (see the header of this workflow)"
              exit 1
            fi
          done

          key_path="$RUNNER_TEMP/AuthKey.p8"
          # Accept the .p8 as-is or base64-encoded.
          if printf '%s' "$KEY_CONTENTS" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$KEY_CONTENTS" > "$key_path"
          else
            printf '%s' "$KEY_CONTENTS" | tr -d '[:space:]' | base64 --decode -o "$key_path"
          fi
          auth=(
            -allowProvisioningUpdates
            -authenticationKeyPath "$key_path"
            -authenticationKeyID "$(printf '%s' "$KEY_ID" | tr -d '[:space:]')"
            -authenticationKeyIssuerID "$(printf '%s' "$ISSUER_ID" | tr -d '[:space:]')"
          )

          version_args=( "CURRENT_PROJECT_VERSION=$BUILD_NUMBER" )
          if [ -n "${INPUT_VERSION:-}" ]; then
            version_args+=( "MARKETING_VERSION=$INPUT_VERSION" )
          fi

          cache="$HOME/Library/Caches/swiftfin-ci"
          name="$(echo "$SCHEME" | tr ' ' '-')"
          archive="$RUNNER_TEMP/$name.xcarchive"
          log="$RUNNER_TEMP/archive-$name.log"

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST

          xcodebuild -version
          echo "Archiving $SCHEME, build $BUILD_NUMBER${INPUT_VERSION:+, version $INPUT_VERSION}"

          status=0
          xcodebuild archive \
            -project Swiftfin.xcodeproj \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -configuration Release \
            -archivePath "$archive" \
            -derivedDataPath "$cache/DerivedData-release" \
            -clonedSourcePackagesDirPath "$cache/SourcePackages" \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            "${auth[@]}" \
            "${version_args[@]}" \
            > "$log" 2>&1 || status=$?

          if [ $status -ne 0 ]; then
            tail -n 60 "$log"
            echo "===== COMPILER ERRORS ($SCHEME, Release) ====="
            grep -E "^/.*: (error|fatal error): |error: " "$log" | sed "s|$GITHUB_WORKSPACE/||" | sort -u | head -n 300 || true
            echo "===== END COMPILER ERRORS ====="
            rm -f "$key_path"
            exit $status
          fi

          xcodebuild -exportArchive \
            -archivePath "$archive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export-$name" \
            "${auth[@]}" || status=$?

          rm -f "$key_path"
          exit $status

      - name: Clean up
        if: ${{ always() }}
        run: rm -rf "$RUNNER_TEMP"/AuthKey.p8 "$RUNNER_TEMP"/*.xcarchive "$RUNNER_TEMP"/export-*
