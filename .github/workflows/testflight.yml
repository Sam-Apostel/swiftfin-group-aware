name: "TestFlight ✈️"

# Runs entirely on the self-hosted runner on Sam's Mac (labels: self-hosted, macOS, swiftfin-mac):
# no GitHub-hosted macOS minutes are used.
#
# Signing and upload go through the Apple account signed in to Xcode on that Mac (Xcode ▸ Settings ▸
# Accounts) with automatic signing (-allowProvisioningUpdates), so no secrets are needed (same as
# slide-station). If the optional APP_STORE_* secrets exist, the App Store Connect API key is used instead.
#
# Triggers (same cadence as Reizo):
#   - every day at 17:43 UTC, but only when the app changed since the last TestFlight build
#   - manually (Actions ▸ TestFlight ✈️ ▸ Run workflow), or T-Minus' "Ship" button (its release
#     target is this workflow). Tick "force" to ship even without app changes.
# Each successful upload is tagged `testflight/<build>`; "changed" means files outside .github/,
# Documentation/ and Markdown changed since the newest such tag.
#
# Optional secrets (Settings ▸ Secrets and variables ▸ Actions ▸ Secrets):
#   APP_STORE_KEY_ID        API key id
#   APP_STORE_ISSUER_ID     issuer id
#   APP_STORE_KEY_CONTENTS  the AuthKey_XXXX.p8 file, as-is or base64 (key role: Admin, needed for cloud signing)
#
#   TMINUS_KEY              the Couchfin project's FULL T-Minus ingest key (T-Minus: get_ingest_key, project couchfin).
#                           With it, the pending "For testers" notes of merged PRs ship inside the app ("What's new"),
#                           become TestFlight's What to Test (that also needs the APP_STORE_* key), and the release is
#                           recorded in T-Minus after a successful upload. Without it, builds ship without notes.

on:
  schedule:
    # 17:43 UTC: early evening in Brussels, after the day's merges.
    - cron: '43 17 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: "Ship even if the app didn't change since the last TestFlight build"
        type: boolean
        default: false
      platform:
        description: "Platform"
        required: true
        type: choice
        options:
          - All
          - iOS
          - tvOS
      version:
        description: "Version (empty = the project's MARKETING_VERSION)"
        required: false
        type: string
      build:
        description: "Build (empty = UTC time, yyyymmddHHMM)"
        required: false
        type: number

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  # Pushes the testflight/<build> tag after an upload.
  contents: write

jobs:
  # One version, build number and set of release notes for every platform in this run.
  prepare:
    name: "Release notes 📝"
    runs-on: [ self-hosted, macOS, swiftfin-mac ]
    outputs:
      ship: ${{ steps.changes.outputs.ship }}
      version: ${{ steps.meta.outputs.version }}
      build: ${{ steps.meta.outputs.build }}
      whats_new: ${{ steps.notes.outputs.whats_new }}
      what_to_test: ${{ steps.notes.outputs.what_to_test }}
    env:
      INPUT_VERSION: ${{ inputs.version }}
      INPUT_BUILD: ${{ inputs.build }}
      TMINUS_KEY: ${{ secrets.TMINUS_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Anything new since the last TestFlight build?
        id: changes
        env:
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          last="$(git tag --list 'testflight/*' --sort=-creatordate | head -n 1)"
          if [ "${FORCE:-false}" = "true" ]; then
            echo "Forced"
            echo "ship=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$last" ]; then
            echo "No earlier TestFlight build tag"
            echo "ship=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$last" HEAD -- . ':(exclude).github' ':(exclude)Documentation' ':(exclude)*.md'; then
            echo "Nothing changed in the app since $last; not shipping (tick force to ship anyway)."
            echo "ship=false" >> "$GITHUB_OUTPUT"
          else
            echo "App changes since $last:"
            git diff --stat "$last" HEAD -- . ':(exclude).github' ':(exclude)Documentation' ':(exclude)*.md' | tail -n 1
            echo "ship=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Version and build
        id: meta
        run: |
          set -euo pipefail
          build="${INPUT_BUILD:-$(date -u +%Y%m%d%H%M)}"
          version="${INPUT_VERSION:-}"
          if [ -z "$version" ]; then
            # The app targets' MARKETING_VERSION (the Top Shelf extension's is lower).
            version="$(sed -n 's/.*MARKETING_VERSION = \([^;]*\);.*/\1/p' Swiftfin.xcodeproj/project.pbxproj | tr -d '"' | sort -V | tail -n 1)"
          fi
          echo "Version $version, build $build"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - name: Pending notes from T-Minus
        id: notes
        if: steps.changes.outputs.ship == 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD: ${{ steps.meta.outputs.build }}
        run: |
          set -euo pipefail
          # Never fails: without TMINUS_KEY, or when T-Minus is down, the notes are empty.
          /usr/bin/python3 Scripts/CI/tminus.py next \
            --out "$RUNNER_TEMP/CouchfinWhatsNew.json" \
            --text-out "$RUNNER_TEMP/what-to-test.txt" \
            --version "$VERSION" --build "$BUILD"
          echo "whats_new=$(base64 < "$RUNNER_TEMP/CouchfinWhatsNew.json" | tr -d '\n')" >> "$GITHUB_OUTPUT"
          echo "what_to_test=$(base64 < "$RUNNER_TEMP/what-to-test.txt" | tr -d '\n')" >> "$GITHUB_OUTPUT"

  testflight:
    name: "TestFlight ✈️ (${{ matrix.scheme }})"
    needs: prepare
    if: ${{ needs.prepare.outputs.ship == 'true' }}
    runs-on: [ self-hosted, macOS, swiftfin-mac ]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: iOS
            scheme: "Swiftfin"
            destination: "generic/platform=iOS"
            archive_signing: ""
          - platform: tvOS
            scheme: "Swiftfin tvOS"
            destination: "generic/platform=tvOS"
            # a development profile needs a registered Apple TV: archive unsigned, the export signs for the App Store
            archive_signing: "CODE_SIGNING_ALLOWED=NO"

    env:
      SELECTED_PLATFORM: ${{ inputs.platform || 'All' }}
      SCHEME: ${{ matrix.scheme }}
      DESTINATION: ${{ matrix.destination }}
      ARCHIVE_SIGNING: ${{ matrix.archive_signing }}
      KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
      KEY_CONTENTS: ${{ secrets.APP_STORE_KEY_CONTENTS }}
      INPUT_VERSION: ${{ inputs.version }}
      BUILD_NUMBER: ${{ needs.prepare.outputs.build }}
      WHATS_NEW: ${{ needs.prepare.outputs.whats_new }}

    steps:
      - name: Skip unselected platform
        id: gate
        run: |
          if [ "$SELECTED_PLATFORM" = "All" ] || [ "$SELECTED_PLATFORM" = "${{ matrix.platform }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping ${{ matrix.platform }} (selected: $SELECTED_PLATFORM)"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Bundle release notes
        if: steps.gate.outputs.run == 'true'
        run: |
          # Shared/ is a synchronized group, so this file ships in the app ("What's new").
          if [ -n "$WHATS_NEW" ]; then
            printf '%s' "$WHATS_NEW" | base64 --decode > Shared/Resources/CouchfinWhatsNew.json
            cat Shared/Resources/CouchfinWhatsNew.json
          fi

      - name: Archive and upload
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"

          auth=( -allowProvisioningUpdates )
          key_path="$RUNNER_TEMP/AuthKey.p8"
          if [ -n "$(printf '%s' "$KEY_CONTENTS$KEY_ID$ISSUER_ID" | tr -d '[:space:]')" ]; then
            echo "Signing with the App Store Connect API key"
            # Accept the .p8 as-is or base64-encoded.
            if printf '%s' "$KEY_CONTENTS" | grep -q "BEGIN PRIVATE KEY"; then
              printf '%s\n' "$KEY_CONTENTS" > "$key_path"
            else
              printf '%s' "$KEY_CONTENTS" | tr -d '[:space:]' | base64 --decode -o "$key_path"
            fi
            auth+=(
              -authenticationKeyPath "$key_path"
              -authenticationKeyID "$(printf '%s' "$KEY_ID" | tr -d '[:space:]')"
              -authenticationKeyIssuerID "$(printf '%s' "$ISSUER_ID" | tr -d '[:space:]')"
            )
          else
            echo "Signing with the Apple account signed in to Xcode on this Mac"
          fi

          version_args=( "CURRENT_PROJECT_VERSION=$BUILD_NUMBER" )
          if [ -n "${INPUT_VERSION:-}" ]; then
            version_args+=( "MARKETING_VERSION=$INPUT_VERSION" )
          fi

          cache="$HOME/Library/Caches/swiftfin-ci"
          name="$(echo "$SCHEME" | tr ' ' '-')"
          archive="$RUNNER_TEMP/$name.xcarchive"
          log="$RUNNER_TEMP/archive-$name.log"

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>Y3734CNKQ8</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
            <key>testFlightInternalTestingOnly</key><false/>
          </dict>
          </plist>
          PLIST

          xcodebuild -version
          echo "Archiving $SCHEME, build $BUILD_NUMBER${INPUT_VERSION:+, version $INPUT_VERSION}"

          status=0
          xcodebuild archive \
            -project Swiftfin.xcodeproj \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -configuration Release \
            -archivePath "$archive" \
            -derivedDataPath "$cache/DerivedData-release" \
            -clonedSourcePackagesDirPath "$cache/SourcePackages" \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            "${auth[@]}" \
            "${version_args[@]}" \
            ${ARCHIVE_SIGNING:+"$ARCHIVE_SIGNING"} \
            > "$log" 2>&1 || status=$?

          if [ $status -ne 0 ]; then
            tail -n 60 "$log"
            echo "===== COMPILER ERRORS ($SCHEME, Release) ====="
            grep -E "^/.*: (error|fatal error): |error: " "$log" | sed "s|$GITHUB_WORKSPACE/||" | sort -u | head -n 300 || true
            echo "===== END COMPILER ERRORS ====="
            rm -f "$key_path"
            exit $status
          fi

          # The App Store rejects arm64e slices in embedded frameworks (MPVUI's tvOS Libmpv ships
          # arm64 + arm64e). Strip them before export, which signs the app for the App Store.
          for fw in "$archive"/Products/Applications/*.app/Frameworks/*.framework; do
            [ -d "$fw" ] || continue
            bin="$fw/$(basename "$fw" .framework)"
            if lipo -archs "$bin" 2>/dev/null | tr ' ' '\n' | grep -qx arm64e; then
              lipo -remove arm64e "$bin" -output "$bin"
              echo "Stripped arm64e from $(basename "$fw")"
            fi
          done

          # tvOS expects CFBundleAlternateIcons as an array of icon names, but actool writes the iOS
          # dictionary form, which App Store validation rejects ("missing the Alternate Icon asset").
          if [ "${{ matrix.platform }}" = "tvOS" ]; then
            for plist in "$archive"/Products/Applications/*.app/Info.plist; do
              /usr/bin/python3 - "$plist" <<'PY'
          import plistlib, sys
          path = sys.argv[1]
          with open(path, "rb") as f:
              info = plistlib.load(f)
          icons = info.get("CFBundleIcons", {})
          alternates = icons.get("CFBundleAlternateIcons")
          if isinstance(alternates, dict):
              icons["CFBundleAlternateIcons"] = sorted(alternates)
              with open(path, "wb") as f:
                  plistlib.dump(info, f, fmt=plistlib.FMT_BINARY)
              print("Converted tvOS alternate icons to an array:", icons["CFBundleAlternateIcons"])
          PY
            done
          fi

          xcodebuild -exportArchive \
            -archivePath "$archive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export-$name" \
            "${auth[@]}" || status=$?

          rm -f "$key_path"
          exit $status

      - name: Clean up
        if: ${{ always() }}
        run: |
          rm -rf "$RUNNER_TEMP"/AuthKey.p8 "$RUNNER_TEMP"/*.xcarchive "$RUNNER_TEMP"/export-*
          git checkout -- Shared/Resources/CouchfinWhatsNew.json 2>/dev/null || true

  # After every selected platform uploaded: record the release in T-Minus (it takes the pending notes)
  # and set TestFlight's What to Test. Both are best effort and never fail the run.
  release:
    name: "Release notes ✅"
    needs: [ prepare, testflight ]
    if: ${{ needs.testflight.result == 'success' }}
    runs-on: [ self-hosted, macOS, swiftfin-mac ]
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD: ${{ needs.prepare.outputs.build }}
      WHAT_TO_TEST: ${{ needs.prepare.outputs.what_to_test }}
      SELECTED_PLATFORM: ${{ inputs.platform || 'All' }}
      TMINUS_KEY: ${{ secrets.TMINUS_KEY }}
      KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
      KEY_CONTENTS: ${{ secrets.APP_STORE_KEY_CONTENTS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tag the build
        run: |
          # The next scheduled run compares against this tag.
          git tag "testflight/$BUILD" "$GITHUB_SHA"
          git push origin "testflight/$BUILD"

      - name: Record the release in T-Minus
        run: |
          /usr/bin/python3 Scripts/CI/tminus.py cut \
            --version "$VERSION ($BUILD)" \
            --commit "$GITHUB_SHA" \
            --url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: TestFlight What to Test
        run: |
          printf '%s' "$WHAT_TO_TEST" | base64 --decode > "$RUNNER_TEMP/what-to-test.txt"
          expected=1
          if [ "$SELECTED_PLATFORM" = "All" ]; then expected=2; fi
          /usr/bin/python3 Scripts/CI/tminus.py what-to-test \
            --notes "$RUNNER_TEMP/what-to-test.txt" \
            --bundle-id land.sams.swiftfin \
            --version "$VERSION" --build "$BUILD" \
            --expected "$expected" --timeout 30
