name: "TestFlight ✈️"

# Runs entirely on the self-hosted runner on Sam's Mac (labels: self-hosted, macOS, swiftfin-mac):
# no GitHub-hosted macOS minutes are used.
#
# Triggers:
#   - manually (Actions ▸ TestFlight ✈️ ▸ Run workflow)
#   - on every push to main, ONLY when the repository variable TESTFLIGHT_ON_PUSH is "true".
#     Bursts of pushes collapse into a single build of the newest commit.
#
# Repository variables (Settings ▸ Secrets and variables ▸ Actions ▸ Variables):
#   APP_BUNDLE_ID       e.g. be.apostel.swiftfin (defaults to the Fastfile fallback when unset)
#   TESTFLIGHT_ON_PUSH  "true" to upload a TestFlight build for every push to main
#   XCODE_VERSION       optional; when unset the Mac's currently selected Xcode is used
#
# Secrets: see the "[Mac] Set up automated TestFlight builds" issue.

on:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [testflight]
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform"
        required: true
        type: choice
        options:
          - All
          - iOS
          - tvOS
      version:
        description: "Version"
        required: false
        type: string
      build:
        description: "Build"
        required: false
        type: number
      xcodeVersion:
        description: "Xcode (empty = the Mac's selected Xcode)"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  resolve_platform:
    name: Resolve platform
    if: ${{ github.event_name != 'push' || vars.TESTFLIGHT_ON_PUSH == 'true' }}
    runs-on: [ self-hosted, macOS, swiftfin-mac ]
    env:
      IOS_SCHEME: "Swiftfin"
      TVOS_SCHEME: "Swiftfin tvOS"
      EVENT_NAME: ${{ github.event_name }}
      PLATFORM_INPUT: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.platform || inputs.platform || github.event.inputs.platform }}
    outputs:
      platform: ${{ steps.resolve.outputs.platform }}
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Resolve platform and matrix
        id: resolve
        run: |
          set -euo pipefail

          clean() {
            printf '%s' "${1:-}" | tr -d '\r\n'
          }

          if [ "$EVENT_NAME" = "push" ]; then
            platform="all"
          else
            platform="$(clean "$PLATFORM_INPUT" | tr '[:upper:]' '[:lower:]')"
          fi

          case "$platform" in
            ios)
              matrix="{\"include\":[{\"platform\":\"ios\",\"scheme\":\"$IOS_SCHEME\"}]}"
              ;;
            tvos)
              matrix="{\"include\":[{\"platform\":\"tvos\",\"scheme\":\"$TVOS_SCHEME\"}]}"
              ;;
            all)
              matrix="{\"include\":[{\"platform\":\"ios\",\"scheme\":\"$IOS_SCHEME\"},{\"platform\":\"tvos\",\"scheme\":\"$TVOS_SCHEME\"}]}"
              ;;
            *)
              echo "Invalid platform '$platform'. Use ios, tvos, or all."
              exit 1
              ;;
          esac

          echo "platform=$platform" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  test_build:
    name: Build and upload to TestFlight
    needs: resolve_platform
    runs-on: [ self-hosted, macOS, swiftfin-mac ]
    timeout-minutes: 90
    strategy:
      # One runner builds one platform at a time; keep going if one platform fails.
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.resolve_platform.outputs.matrix) }}
    env:
      PLATFORM: ${{ matrix.platform }}
      SCHEME: ${{ matrix.scheme }}
      APP_BUNDLE_ID: ${{ vars.APP_BUNDLE_ID }}
      BUILD_CERTIFICATE_BASE64: ${{ github.event.client_payload.BUILD_CERTIFICATE_BASE64 || secrets.BUILD_CERTIFICATE_BASE64 }}
      BUILD_PROVISION_PROFILE_BASE64: ${{ matrix.platform == 'ios' && (github.event.client_payload.BUILD_PROVISION_PROFILE_IOS_BASE64 || secrets.BUILD_PROVISION_PROFILE_IOS_BASE64) || (github.event.client_payload.BUILD_PROVISION_PROFILE_TVOS_BASE64 || secrets.BUILD_PROVISION_PROFILE_TVOS_BASE64) }}
      FL_PROFILE_NAME_BASE64: ${{ matrix.platform == 'ios' && (github.event.client_payload.PROFILE_NAME_IOS_BASE64 || secrets.PROFILE_NAME_IOS_BASE64) || (github.event.client_payload.PROFILE_NAME_TVOS_BASE64 || secrets.PROFILE_NAME_TVOS_BASE64) }}
      P12_PASSWORD: ${{ github.event.client_payload.P12_PASSWORD || secrets.P12_PASSWORD }}
      KEYCHAIN_PASSWORD: CI_PASSWORD
      FL_KEY_ID: ${{ github.event.client_payload.APP_STORE_KEY_ID || secrets.APP_STORE_KEY_ID }}
      FL_ISSUER_ID: ${{ github.event.client_payload.APP_STORE_ISSUER_ID || secrets.APP_STORE_ISSUER_ID }}
      FL_KEY_CONTENTS: ${{ github.event.client_payload.APP_STORE_KEY_CONTENTS || secrets.APP_STORE_KEY_CONTENTS }}
      FL_CODE_SIGN_BASE64: ${{ github.event.client_payload.CODE_SIGN_BASE64 || secrets.CODE_SIGN_BASE64 }}
      PAYLOAD_XCODE_VERSION: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.XCODE_VERSION || inputs.xcodeVersion || github.event.inputs.xcodeVersion || vars.XCODE_VERSION }}
      PAYLOAD_BUILD: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.BUILD || inputs.build || github.event.inputs.build }}
      PAYLOAD_VERSION: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.VERSION || inputs.version || github.event.inputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.ref || github.sha }}
          fetch-depth: 0

      - name: Ruby + fastlane (Homebrew Ruby, no setup-ruby on self-hosted)
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/ruby/bin:/usr/local/opt/ruby/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          if ! command -v bundle >/dev/null; then
            echo "Bundler missing. On the Mac run: brew install ruby && gem install bundler"
            exit 1
          fi
          ruby --version
          bundle config set --local path "$HOME/Library/Caches/swiftfin-ci/bundle"
          bundle install --jobs 4
          echo "PATH=$PATH" >> "$GITHUB_ENV"

      - name: Install Homebrew dependencies
        run: brew bundle --file Brewfile

      - name: Install certificate and provisioning profile (temporary keychain)
        run: |
          set -euo pipefail

          clean() {
            printf '%s' "${1:-}" | tr -d '\r\n'
          }

          decode_base64_to_file() {
            local value="$1"
            local path="$2"
            printf '%s' "$value" | base64 --decode -o "$path"
          }

          cert_base64="$(clean "$BUILD_CERTIFICATE_BASE64")"
          profile_base64="$(clean "$BUILD_PROVISION_PROFILE_BASE64")"
          p12_password="$(clean "$P12_PASSWORD")"

          if [ -z "$cert_base64" ] || [ -z "$profile_base64" ] || [ -z "$p12_password" ]; then
            echo "Missing required signing values"
            exit 1
          fi

          cert_path="$RUNNER_TEMP/build_certificate.p12"
          profile_path="$RUNNER_TEMP/build_${PLATFORM}.mobileprovision"
          keychain_path="$RUNNER_TEMP/app-signing.keychain-db"

          decode_base64_to_file "$cert_base64" "$cert_path"
          decode_base64_to_file "$profile_base64" "$profile_path"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"

          security import "$cert_path" -P "$p12_password" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$keychain_path"

          # This is a personal Mac: ADD the temporary keychain to the search list instead of replacing
          # the user's keychains (the hosted-runner version replaced the list).
          existing_keychains=$(security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"$//')
          security list-keychains -d user -s "$keychain_path" $existing_keychains

          # No sudo on a personal Mac: user-level profile locations only.
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$profile_path" "$dir/"
          done

      - name: Generate changelog
        id: changelog
        run: |
          set -euo pipefail
          log="$(git log -15 --no-merges --pretty='- %s' 2>/dev/null || true)"
          if [ -z "$log" ]; then
            log="General performance changes, fixes, and localization changes."
          fi
          {
            echo "changelog<<CHANGELOG_EOF"
            echo "$log"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and upload to TestFlight
        env:
          AUTO_CHANGELOG: ${{ steps.changelog.outputs.changelog }}
        run: |
          set -euo pipefail

          clean() {
            printf '%s' "${1:-}" | tr -d '\r\n'
          }

          require_non_empty() {
            local value="$1"
            local label="$2"
            if [ -z "$value" ]; then
              echo "Missing required value: $label"
              exit 1
            fi
          }

          key_id="$(clean "$FL_KEY_ID")"
          issuer_id="$(clean "$FL_ISSUER_ID")"
          key_contents="$(clean "$FL_KEY_CONTENTS")"
          code_sign_base64="$(clean "$FL_CODE_SIGN_BASE64")"
          profile_name_base64="$(clean "$FL_PROFILE_NAME_BASE64")"
          payload_build="$(clean "$PAYLOAD_BUILD")"
          payload_version="$(clean "$PAYLOAD_VERSION")"
          xcode_version="$(clean "$PAYLOAD_XCODE_VERSION")"

          require_non_empty "$key_id" "FL_KEY_ID"
          require_non_empty "$issuer_id" "FL_ISSUER_ID"
          require_non_empty "$key_contents" "FL_KEY_CONTENTS"
          require_non_empty "$code_sign_base64" "FL_CODE_SIGN_BASE64"
          require_non_empty "$profile_name_base64" "FL_PROFILE_NAME_BASE64"
          require_non_empty "$SCHEME" "SCHEME"

          changelog_file="$(mktemp)"
          printf '%s' "$AUTO_CHANGELOG" > "$changelog_file"

          args=(
            "keyID:$key_id"
            "issuerID:$issuer_id"
            "keyContents:$key_contents"
            "codeSign64:$code_sign_base64"
            "profileName64:$profile_name_base64"
            "changelogFile:$changelog_file"
            "scheme:\"$SCHEME\""
          )

          # Only switch Xcode when explicitly requested; otherwise use the Mac's selected Xcode.
          if [ -n "$xcode_version" ]; then
            args+=("xcodeVersion:$xcode_version")
          fi

          if [ -n "$payload_build" ]; then
            args+=("build:$payload_build")
          fi

          if [ -n "$payload_version" ]; then
            args+=("version:$payload_version")
          fi

          echo "Building and uploading scheme '$SCHEME' for platform '$PLATFORM'"
          bundle exec fastlane testFlightLane "${args[@]}"

      - name: Remove temporary keychain and profile
        if: ${{ always() }}
        run: |
          keychain_path="$RUNNER_TEMP/app-signing.keychain-db"
          if [ -f "$keychain_path" ]; then
            security delete-keychain "$keychain_path" || true
          fi
          rm -f "$RUNNER_TEMP/build_certificate.p12" "$RUNNER_TEMP/build_${PLATFORM}.mobileprovision"
