name: "Build 🔨"

# Runs on a self-hosted runner on Sam's Mac (labels: self-hosted, macOS, swiftfin-mac)
# so no GitHub-hosted macOS minutes are used. Jobs simply queue while the Mac is offline.
# Setup: see the "[Mac] Set up the self-hosted GitHub Actions runner" issue.

on:
  push:
    branches: [ main, next ]
    paths:
      - '**'
      - '!Translations/*.lproj/**'
      - 'Translations/en.lproj/**'
  workflow_dispatch:

# Only the newest commit on each branch is worth building: cancel superseded runs.
# `next` is the integration branch for the post-movie-night wave (#3); it is merged into main afterwards.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "Build 🔨"
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: "Swiftfin"
            destination: "generic/platform=iOS"
          - scheme: "Swiftfin tvOS"
            destination: "generic/platform=tvOS"

    runs-on: [ self-hosted, macOS, swiftfin-mac ]
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        env:
          SCHEME: ${{ matrix.scheme }}
          DESTINATION: ${{ matrix.destination }}
        run: |
          set -uo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"

          # Persistent caches outside the workspace so incremental builds stay fast between runs.
          cache="$HOME/Library/Caches/swiftfin-ci"
          mkdir -p "$cache"
          log="$RUNNER_TEMP/build-$(echo "$SCHEME" | tr ' ' '-').log"

          xcodebuild -version

          xcodebuild build \
            -project Swiftfin.xcodeproj \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -configuration Debug \
            -derivedDataPath "$cache/DerivedData" \
            -clonedSourcePackagesDirPath "$cache/SourcePackages" \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            > "$log" 2>&1
          status=$?

          # Print a compact, de-duplicated error summary at the END of the log so it is easy to read
          # (agents fetch the tail of this log to fix compile errors).
          echo "::group::Last 60 lines of xcodebuild output"
          tail -n 60 "$log"
          echo "::endgroup::"
          echo "===== COMPILER ERRORS ($SCHEME) ====="
          grep -E "^/.*: (error|fatal error): " "$log" | sed "s|$GITHUB_WORKSPACE/||" | sort -u | head -n 300 || true
          echo "===== END COMPILER ERRORS ====="
          exit $status
