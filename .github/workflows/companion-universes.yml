name: "Companion: Universes 🪐"

# Tests the Couchfin Universes service and publishes its image to GHCR
# (ghcr.io/sam-apostel/couchfin-universes) for the Umbrel app.

on:
  push:
    branches: [ main ]
    paths:
      - 'Companion/universes/**'
      - '.github/workflows/companion-universes.yml'
  pull_request:
    paths:
      - 'Companion/universes/**'
      - '.github/workflows/companion-universes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: "Test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Companion/universes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Companion/universes/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm test

  image:
    name: "Publish image"
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: echo "version=$(node -p "require('./Companion/universes/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: Companion/universes
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/sam-apostel/couchfin-universes:${{ steps.version.outputs.version }}
            ghcr.io/sam-apostel/couchfin-universes:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Cinematic universes for Couchfin

      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### ghcr.io/sam-apostel/couchfin-universes:${VERSION}"
            echo
            echo "Digest: \`${DIGEST}\`"
            echo
            echo "Pin it in the Umbrel app with \`Companion/umbrel/pin-image.sh ${VERSION} ../umbrel-apps\`."
          } >> "$GITHUB_STEP_SUMMARY"
