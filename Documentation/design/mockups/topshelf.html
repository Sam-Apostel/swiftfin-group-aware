<!doctype html><html><head><style>
html,body{margin:0;width:100vw;height:100vh;overflow:hidden;background:#01061A}
.bg{position:absolute;inset:0;background:url(abyss-landscape.jpg) center/cover}
img{position:absolute;height:74vh;top:13vh}
</style></head><body><div class="bg"></div><img id="f" src="fin-fish.png">
<script>const p=new URLSearchParams(location.search).get('pos')||'center';const f=document.getElementById('f');
f.onload=()=>{const w=f.getBoundingClientRect().width;const W=innerWidth;
f.style.left=(p==='left'?W*0.12:p==='right'?W*0.88-w:(W-w)/2)+'px'}</script></body></html>
